# software-engineering module tasks — deployed asset, not hand-edited.
#
# Appended to the `tasks:` block of the criterion's `Taskfile.common.yml` on
# instantiation and on `/sync-framework` (`MODULE-SPECIFICATION.md` §6.5).
# One task per command in this module's `code-of-conduct.module.md` §4, in
# the same thin-dispatch shape as the kernel's own tasks: `{{.AGENT_CMD}}` is
# the kernel template's, never declared here, and each task runs from the
# caller's directory (the composer adds its `dir:`).
#
# Usage: catalyst task <command-name> -- <arguments>
#   e.g. catalyst task roadmap -- add product-2027 roadmap.md

version: "3"

tasks:
  roadmap:
    desc: "Named roadmaps: add <name> <file> | update <name> <file> | merge <name> <update file> | remove <name>"
    cmds:
      - '{{.AGENT_CMD}} "/roadmap {{.CLI_ARGS}}"'

  show-backlog:
    desc: "Summarize open work/blockers and refresh BACKLOG.md and roadmaps"
    cmds:
      - '{{.AGENT_CMD}} "/show-backlog {{.CLI_ARGS}}"'
